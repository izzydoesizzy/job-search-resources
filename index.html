  "new-grads": "#22C55E",
  "career-changers": "#F59E0B",

const pricingConfig = {

  "freemium": { label: "Freemium", color: "#F59E0B", bg: "#F59E0B15", border: "#F59E0B30" },

function JobSearchResourceHub() {
  const [activeCategory, setActiveCategory] = useState(null);
  const [activeAudience, setActiveAudience] = useState(null);
  const [activePricing, setActivePricing] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [expandedItem, setExpandedItem] = useState(null);

    items: cat.items.filter(item => {
      const matchesAudience = !activeAudience || item.audience.includes(activeAudience);
      const matchesPricing = !activePricing || item.pricing === activePricing;

        item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
        item.monetization.toLowerCase().includes(searchQuery.toLowerCase());

              maxWidth: "440px",

                      overflow: isExpanded ? "visible" : "hidden",

                          fontFamily: "'IBM Plex Mono', monospace",
                          fontSize: "9px",
                          letterSpacing: "2px",
                          color: "#555",
                          marginBottom: "6px",
                        }}>

                        <p style={{ fontSize: "13px", color: "#BBB", margin: 0, lineHeight: 1.5 }}>

                      {item.audience.map(aud => (
                        <span key={aud} style={{
                          fontSize: "10px",
                          color: audienceColors[aud],
                          background: audienceColors[aud] + "12",
                          padding: "2px 8px",
                          borderRadius: "10px",
                        }}>
                          {audienceLabels[aud]}
                        </span>
                      ))}
                      {item.url && isExpanded && (
                        <a
                          href={item.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={(e) => e.stopPropagation()}
                          style={{
                            fontSize: "10px",
                            color: "#555",
                            marginLeft: "auto",
                            textDecoration: "none",
                            borderBottom: "1px dotted #333",
                          }}
                        >
                          {"Visit \u2192"}
                        </a>
                      )}
                    </div>
                  </div>

              })}

          </div>
        ))}

        {totalItems === 0 && (
          <div style={{ textAlign: "center", padding: "60px 20px", color: "#444" }}>
            <div style={{ fontSize: "48px", marginBottom: "16px" }}>{"\u{1F50D}"}</div>
